<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <!-- Latar -->
  <rect width="1200" height="400" fill="#fdf6e3"/>

  <!-- Grid jalan tipis -->
  <g stroke="#1a1a1a" stroke-opacity="0.06">
    <path d="M 0 80 H1200 M 0 160 H1200 M 0 240 H1200 M 0 320 H1200" />
    <path d="M 120 0 V400 M 240 0 V400 M 360 0 V400 M 480 0 V400 M 600 0 V400 M 720 0 V400 M 840 0 V400 M 960 0 V400 M 1080 0 V400" />
  </g>

  <!-- Header dokumen -->
  <rect x="40" y="28" width="268" height="30" fill="#1a1a1a"/>
  <text x="54" y="48" font-size="13" letter-spacing="2" fill="#ffd21e">RENCANA RUTE · REF AV-RT-07</text>
  <text x="1160" y="48" text-anchor="end" font-size="12" letter-spacing="2" fill="#1a1a1a" fill-opacity="0.55">BAGAN BATU · 2026</text>

  <!-- Ringkasan perjalanan -->
  <text x="1160" y="84" text-anchor="end" font-size="13" fill="#1a1a1a">
    38 KM&#160;&#160;·&#160;&#160;2 JAM 10 MENIT&#160;&#160;·&#160;&#160;3 PEMBERHENTIAN
  </text>

  <!-- Rute ortogonal (garis jalan putus-putus) -->
  <path d="M 140 312 L 140 190 L 470 190 L 470 260 L 760 260 L 760 150 L 1030 150"
        fill="none" stroke="#1a1a1a" stroke-width="4" stroke-dasharray="16 11" stroke-linecap="square"/>

  <!-- Arah perjalanan (chevron) -->
  <g fill="#1a1a1a">
    <path d="M 140 236 l -7 8 h 14 z" transform="rotate(-90 140 244)"/>
    <path d="M 300 183 l 8 7 v -14 z"/>
    <path d="M 470 232 l 7 8 h -14 z" transform="rotate(180 474 236)"/>
    <path d="M 615 253 l 8 7 v -14 z"/>
    <path d="M 760 210 l -7 8 h 14 z" transform="rotate(-90 760 214)"/>
    <path d="M 895 143 l 8 7 v -14 z"/>
  </g>

  <!-- Asal: gudang -->
  <g>
    <circle cx="140" cy="312" r="20" fill="#ff6a00" stroke="#1a1a1a" stroke-width="5"/>
    <circle cx="140" cy="312" r="7" fill="#fdf6e3"/>
    <text x="168" y="317" font-size="13" fill="#1a1a1a">GDG · 06:30</text>
  </g>

  <!-- Drop 01 -->
  <g>
    <rect x="454" y="174" width="32" height="32" fill="#ffd21e" stroke="#1a1a1a" stroke-width="4"/>
    <text x="470" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">1</text>
    <text x="500" y="166" font-size="13" fill="#1a1a1a">DROP 01 · 07:20</text>
  </g>

  <!-- Drop 02 -->
  <g>
    <rect x="744" y="244" width="32" height="32" fill="#ffd21e" stroke="#1a1a1a" stroke-width="4"/>
    <text x="760" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">2</text>
    <text x="760" y="302" text-anchor="middle" font-size="13" fill="#1a1a1a">DROP 02 · 08:05</text>
  </g>

  <!-- Tujuan: pelanggan -->
  <g>
    <circle cx="1030" cy="150" r="20" fill="#1a1a1a"/>
    <circle cx="1030" cy="150" r="7" fill="#fdf6e3"/>
    <text x="1030" y="120" text-anchor="middle" font-size="13" fill="#1a1a1a">CUST · 08:40</text>
  </g>

  <!-- Legenda -->
  <g>
    <rect x="40" y="344" width="16" height="16" fill="#ff6a00" stroke="#1a1a1a" stroke-width="3"/>
    <text x="64" y="357" font-size="12" letter-spacing="1" fill="#1a1a1a">ASAL</text>
    <rect x="150" y="344" width="16" height="16" fill="#ffd21e" stroke="#1a1a1a" stroke-width="3"/>
    <text x="174" y="357" font-size="12" letter-spacing="1" fill="#1a1a1a">DROP</text>
    <rect x="290" y="344" width="16" height="16" fill="#1a1a1a"/>
    <text x="314" y="357" font-size="12" letter-spacing="1" fill="#1a1a1a">TUJUAN</text>
    <line x1="420" y1="352" x2="470" y2="352" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="480" y="357" font-size="12" letter-spacing="1" fill="#1a1a1a">RUTE</text>
  </g>
</svg>
