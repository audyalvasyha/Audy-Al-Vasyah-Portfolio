<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <!-- Latar krem ala sheet -->
  <rect width="1200" height="400" fill="#fdf6e3"/>
  <g stroke="#1a1a1a" stroke-opacity="0.07">
    <path d="M 0 40 H1200 M 0 80 H1200 M 0 120 H1200 M 0 160 H1200 M 0 200 H1200 M 0 240 H1200 M 0 280 H1200 M 0 320 H1200 M 0 360 H1200" fill="none"/>
    <path d="M 60 0 V400 M 120 0 V400 M 180 0 V400 M 240 0 V400 M 300 0 V400 M 360 0 V400 M 420 0 V400 M 480 0 V400 M 540 0 V400 M 600 0 V400 M 660 0 V400 M 720 0 V400 M 780 0 V400 M 840 0 V400 M 900 0 V400 M 960 0 V400 M 1020 0 V400 M 1080 0 V400 M 1140 0 V400" fill="none"/>
  </g>

  <!-- Rute putus-putus besar -->
  <path d="M 90 300 C 220 260 260 150 420 170 S 620 260 760 200 S 980 110 1110 140"
        fill="none" stroke="#1a1a1a" stroke-width="5" stroke-dasharray="18 14"/>

  <!-- Waypoint boks -->
  <g stroke="#1a1a1a" stroke-width="5">
    <rect x="415" y="145" width="18" height="18" fill="#22d3ee"/>
    <rect x="640" y="205" width="18" height="18" fill="#ffd21e"/>
    <rect x="950" y="95"  width="18" height="18" fill="#ff6a00"/>
  </g>

  <!-- Pin awal (gudang, oranye) -->
  <g>
    <circle cx="90" cy="262" r="26" fill="#ff6a00" stroke="#1a1a1a" stroke-width="6"/>
    <circle cx="90" cy="262" r="10" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="4"/>
    <text x="90" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">GDG START</text>
  </g>

  <!-- Pin akhir (hitam) -->
  <g>
    <circle cx="1110" cy="102" r="26" fill="#1a1a1a"/>
    <circle cx="1110" cy="102" r="10" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="4"/>
    <text x="1110" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">CUST. END</text>
  </g>

  <!-- Chip label ML -->
  <rect x="300" y="60" width="150" height="36" fill="#1a1a1a"/>
  <text x="375" y="84" text-anchor="middle" font-size="14" fill="#ffd21e">ML SCHEDULING</text>

  <!-- Boks bermuatan di bawah -->
  <g stroke="#1a1a1a" stroke-width="5">
    <rect x="640" y="300" width="70" height="56" fill="#ffd21e"/>
    <rect x="730" y="300" width="70" height="56" fill="#22d3ee"/>
    <rect x="820" y="300" width="70" height="56" fill="#ff6a00"/>
  </g>
  <line x1="640" y1="328" x2="710" y2="328" stroke="#1a1a1a" stroke-width="4" opacity="0.4"/>
  <line x1="730" y1="328" x2="800" y2="328" stroke="#1a1a1a" stroke-width="4" opacity="0.4"/>
  <line x1="820" y1="328" x2="890" y2="328" stroke="#1a1a1a" stroke-width="4" opacity="0.4"/>

  <!-- Corner brackets merah -->
  <g stroke="#ff6a00" stroke-width="5" fill="none">
    <path d="M 20 40 v-20 h20 M 1180 40 v-20 h-20 M 20 360 v20 h20 M 1180 360 v20 h-20"/>
  </g>
</svg>
